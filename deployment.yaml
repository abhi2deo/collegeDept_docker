apiVersion: apps/v1
kind: Deployment

metadata:
  name: college-dept

spec:
  replicas: 3

  selector:
    matchLabels:
      app: college-dept
  template:
    metadata:
      labels:
        app: college-dept

    spec:
      containers:
      - name: college-dept
        image: abhinavdeo/college-dept:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: college-dept-service

spec:
  type: NodePort

  selector:
    app: college-dept

  ports:
  - port: 80
    targetPort: 80
    nodePort: 30013
